<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Секретный альбом</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #000; margin: 0; font-family: sans-serif; }
    #login { display: flex; flex-direction: column; align-items: center; }
    input { padding: 10px; font-size: 18px; margin-bottom: 10px; border-radius: 5px; border: none; width: 200px; text-align: center; }
    button { padding: 10px 20px; font-size: 18px; border-radius: 5px; border: none; cursor: pointer; background: #fff; }
  </style>
</head>
<body>
  <div id="login">
    <input type="password" id="pass" placeholder="Введите пароль">
    <button onclick="checkPassword()">Открыть</button>
  </div>
  <script>
    const correctPassword = "0105"; // 
    const albumLink = "https://photos.app.goo.gl/Jv3UK8GNFwTayKij7"; 
    function checkPassword() {
      const entered = document.getElementById("pass").value;
      if (entered === correctPassword) {
        window.location.href = albumLink;
      } else {
        alert("Неверный пароль");
      }
    }
  </script>
</body>
</html>
